name: Release

# Tags only, deliberately. GitHub withholds secrets from workflows triggered by pull
# requests from forks, so a release job that can only be reached by a tag on this repo is
# a signing key that a drive-by PR cannot reach. `ci.yml` stays unsigned and runs on
# everything; this is the only workflow that touches the Developer ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Notarization is an upload to Apple and a wait on their queue — usually 2-5 minutes,
    # occasionally far longer. `notarytool --wait` blocks for the duration.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A release that ships broken code is worse than a release that never happens.
      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # A throwaway keychain, never the runner's login keychain: it is deleted in the
          # cleanup step below, so the key does not outlive the job even if a later step
          # misbehaves.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign wants to show a GUI "allow access to your keychain?"
          # dialog that nobody is there to click, and fails with errSecInternalComponent
          # after a long silence. It is the single most common way this job breaks.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Default AND searchable: codesign reads the search list, notarytool stores its
          # credential profile in the default keychain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The tag is the single source of truth for the version. Without this the plist's
      # hardcoded 0.1.0 would ship inside a v0.3.0 DMG, and the update check (#75) compares
      # a GitHub tag against CFBundleShortVersionString — so a stale plist means the app
      # either never sees an update or offers one it already has.
      - name: Stamp the version from the tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          # Monotonic across every run, which is what macOS actually compares to decide
          # whether an install is an upgrade.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Support/Info.plist
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Store notary credentials
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials vibenotch \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --keychain "$KEYCHAIN"

      # Identity read back out of the keychain rather than hardcoded, so renewing the cert
      # next February is an export and a secret update, not a code change.
      - name: Build, sign, notarize
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "error: no Developer ID Application identity in the keychain — check DEVELOPER_ID_P12 and its password."; exit 1; }
          echo "Signing as: $IDENTITY"
          make dmg DEVELOPER_ID="$IDENTITY" NOTARY_PROFILE=vibenotch

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="dist/VibeNotch-$VERSION.dmg"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          # Two paths because a tag can arrive either way: pushed on its own, or created by
          # someone drafting the release in the UI first.
          gh release create "$TAG" "$DMG" --generate-notes --title "VibeNotch $VERSION" \
            || gh release upload "$TAG" "$DMG" --clobber
          {
            echo "### VibeNotch $VERSION"
            echo
            echo '```'
            echo "$SHA  $(basename "$DMG")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `always()` so a failure anywhere above still takes the private key off the runner.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
