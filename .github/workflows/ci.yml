name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Assemble app
        run: make app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VibeNotch
          path: VibeNotch.app
