name: CI

# macOS runners bill at 10x minutes and once exhausted the included quota on a
# private repo, so this was opt-in and verification was done locally. Actions
# minutes are FREE and unlimited on PUBLIC repositories, so the push trigger is
# restored here — it costs nothing once the repo is public.
#
# If the repo is still private when this lands, either drop the `push:` trigger
# again or add a self-hosted runner (`runs-on: [self-hosted, macOS]`).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Assemble app
        run: make app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VibeNotch
          path: VibeNotch.app
