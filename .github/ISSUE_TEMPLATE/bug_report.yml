name: Bug report
description: Something the app does that it shouldn't
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots help a lot here.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. …
        2. …
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Often decisive, and cheap to get:
        `log stream --predicate 'subsystem == "dev.agentperch"' --level debug --style compact`
        Categories: jump, answer, hover, usage-credentials.
      render: shell
  - type: input
    id: setup
    attributes:
      label: Setup
      description: macOS version, agent (Claude Code / Codex / …), terminal, and how many displays.
      placeholder: macOS 15.2, Claude Code, Warp, two external displays
    validations: { required: true }
